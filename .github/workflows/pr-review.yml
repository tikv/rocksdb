name: PR Review Pipeline
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, master, denjixu_dev ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-info:
    name: PR Information
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get PR info
      run: |
        echo "PR Number: ${{ github.event.pull_request.number }}"
        echo "PR Title: ${{ github.event.pull_request.title }}"
        echo "Base Branch: ${{ github.event.pull_request.base.ref }}"
        echo "Head Branch: ${{ github.event.pull_request.head.ref }}"
        echo "Changed Files:"
        git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install argparse

    - name: Check code format
      run: |
        VERBOSE_CHECK=1 make check-format || echo "Format check failed, but continuing..."

    - name: Check sources
      run: |
        make check-sources || echo "Source check failed, but continuing..."

    - name: Check buck targets
      run: |
        make check-buck-targets || echo "Buck targets check failed, but continuing..."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        arch: [x86_64]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgflags-dev \
          libsnappy-dev \
          zlib1g-dev \
          libbz2-dev \
          liblz4-dev \
          libzstd-dev \
          valgrind

    - name: Setup compiler
      run: |
        sudo apt-get install -y clang
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV

    - name: Build RocksDB
      run: |
        if [ "${{ matrix.build_type }}" = "Debug" ]; then
          make static_lib DEBUG_LEVEL=1 -j$(nproc)
        else
          make static_lib DEBUG_LEVEL=0 -j$(nproc)
        fi

    - name: Build tests
      run: |
        make db_test -j$(nproc)

    - name: Run smoke tests
      run: |
        timeout 300 ./db_test --gtest_filter="*Basic*" || true

  cross-platform-test:
    name: Cross Platform Test
    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, macos-11, macos-12]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgflags-dev \
          libsnappy-dev \
          zlib1g-dev \
          libbz2-dev \
          liblz4-dev \
          libzstd-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install \
          cmake \
          gflags \
          snappy \
          lz4 \
          zstd

    - name: Build static library
      run: |
        make static_lib DEBUG_LEVEL=0 -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Build basic test
      run: |
        make db_test -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Run basic test
      run: |
        timeout 180 ./db_test --gtest_filter="*Basic*" || true

  performance-regression:
    name: Performance Regression Test
    runs-on: ubuntu-latest
    if: github.event.pull_request.changed_files > 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgflags-dev \
          libsnappy-dev \
          zlib1g-dev \
          libbz2-dev \
          liblz4-dev \
          libzstd-dev

    - name: Build benchmark
      run: |
        make db_bench DEBUG_LEVEL=0 -j$(nproc)

    - name: Run performance test
      run: |
        ./db_bench \
          --benchmarks=fillseq,readrandom,readseq \
          --num=50000 \
          --threads=1 \
          --cache_size=1048576 \
          --bloom_bits=10 \
          --open_files=500000 \
          --db=/tmp/rocksdb_bench

  memory-leak-check:
    name: Memory Leak Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgflags-dev \
          libsnappy-dev \
          zlib1g-dev \
          libbz2-dev \
          liblz4-dev \
          libzstd-dev \
          valgrind

    - name: Build with debug info
      run: |
        make clean
        make db_test DEBUG_LEVEL=1 -j$(nproc)

    - name: Run valgrind test
      run: |
        timeout 600 valgrind \
          --tool=memcheck \
          --leak-check=full \
          --show-leak-kinds=all \
          --track-origins=yes \
          --error-exitcode=1 \
          ./db_test --gtest_filter="*Basic*" \
          || echo "Valgrind test completed with issues"

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for documentation updates
      run: |
        # Check if code changes require documentation updates
        CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
        echo "Changed files: $CHANGED_FILES"
        
        # Check if any .h files changed (API changes)
        if echo "$CHANGED_FILES" | grep -q "include/.*\.h$"; then
          echo "⚠️  Header files changed - consider updating documentation"
          if echo "$CHANGED_FILES" | grep -q "\.md$"; then
            echo "✅ Documentation files also updated"
          else
            echo "❌ No documentation updates found"
          fi
        fi

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, build-validation, cross-platform-test]
    if: always()
    steps:
    - name: Generate summary
      run: |
        echo "## PR Review Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Results:" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Validation: ${{ needs.build-validation.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Cross Platform: ${{ needs.cross-platform-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.build-validation.result }}" = "success" ] && \
           [ "${{ needs.cross-platform-test.result }}" = "success" ]; then
          echo "✅ **PR is ready for review**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **PR needs fixes before review**" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Comment PR
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const results = {
            codeQuality: '${{ needs.code-quality.result }}',
            buildValidation: '${{ needs.build-validation.result }}',
            crossPlatform: '${{ needs.cross-platform-test.result }}'
          };
          
          let comment = '## 🤖 自动化测试报告\n\n';
          comment += '| 测试项目 | 结果 |\n';
          comment += '|---------|------|\n';
          comment += `| 代码质量检查 | ${results.codeQuality === 'success' ? '✅ 通过' : '❌ 失败'} |\n`;
          comment += `| 构建验证 | ${results.buildValidation === 'success' ? '✅ 通过' : '❌ 失败'} |\n`;
          comment += `| 跨平台测试 | ${results.crossPlatform === 'success' ? '✅ 通过' : '❌ 失败'} |\n`;
          comment += '\n';
          
          if (results.buildValidation === 'success' && results.crossPlatform === 'success') {
            comment += '🎉 **所有核心测试通过，PR 可以进行审查！**';
          } else {
            comment += '⚠️  **部分测试失败，请修复后再次提交。**';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          }); 